name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # the version is the git tag (tools/version.py): fetch every tag, not a shallow clone
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # azure.archive.ubuntu.com, the runner's default apt mirror, was unreachable (11 November
      # 2026): use archive.ubuntu.com and retry downloads. Also covers Playwright's --with-deps.
      - name: Use a reachable apt mirror
        run: |
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80retries > /dev/null
          sudo apt-get update || true

      - name: Build the interface (Preact + htm, esbuild)
        run: |
          npm ci
          npm run build
          node --check dist/app.js
          node --check dist/lite.js
          node tests/rules_model_test.js

      - name: Build the .tapp and check size budgets
        run: python3 tools/pack_tapp.py

      # the .tapp carries minified Berry (tools/pack_tapp.py): check its copies as well as the sources
      - name: Berry syntax and request parser test (sources and the .tapp's minified copies)
        run: |
          sudo apt-get install -y --no-install-recommends libreadline-dev
          git clone --depth 1 https://github.com/berry-lang/berry.git "$RUNNER_TEMP/berry"
          make -C "$RUNNER_TEMP/berry" -j"$(nproc)"
          python3 -m zipfile -e dist/TasmoFlow.tapp "$RUNNER_TEMP/tapp"
          "$RUNNER_TEMP/berry/berry" tools/check_syntax.be extension/*.be "$RUNNER_TEMP"/tapp/*.be
          "$RUNNER_TEMP/berry/berry" -s tests/tf_http_test.be
          "$RUNNER_TEMP/berry/berry" -s tests/tf_http_test.be "$RUNNER_TEMP/tapp/tf_http.be"

      - name: End-to-end tests (Chromium, simulated gateway)
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
          node tests/e2e.js

      # tests/e2e.js rebuilds dist/ with a fixed test version (9.9.9): build the real one again
      # (the version of the tag) before it is uploaded and released
      - name: Rebuild the artifacts with the real version
        run: |
          npm run build
          python3 tools/pack_tapp.py

      - uses: actions/upload-artifact@v4
        with:
          name: tasmoflow
          path: dist/
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tasmoflow
          path: dist/

      # The artifact was built by the `build` job from this very tag: its version is the tag's
      # (tools/version.py), nothing to compare.
      # The tag may come from `git push` (no release yet: create it) or from a release
      # published on github.com with "Create new tag" (the release already exists: attach
      # the .tapp to it).
      - name: GitHub release with TasmoFlow.tapp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/TasmoFlow.tapp --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/TasmoFlow.tapp --title "TasmoFlow $GITHUB_REF_NAME" --generate-notes
          fi

      # Cumulative gh-pages branch: every version stays published under /vX.Y.Z/
      - name: Publish the interface on GitHub Pages
        run: tools/publish_pages.sh "Interface $GITHUB_REF_NAME"

    concurrency:
      group: gh-pages
      cancel-in-progress: false

  # Test build, started by hand (Actions > Build > Run workflow, on any branch): publishes the
  # full interface at https://gnatali.github.io/TasmoFlow/dev/app.js, replaced at every run, and a
  # test .tapp (dev/TasmoFlow.tapp) that loads it without SRI pin. No release, no tag. The .tapp
  # only has to be installed again when extension/ or the light interface changed.
  preview:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the test interface and .tapp
        run: |
          id="dev.$(git rev-parse --short=7 HEAD)"
          npm ci
          TF_BUILD="$id" npm run build
          python3 tools/pack_tapp.py --dev --build-id "${id#dev.}"

      - name: Publish dev/ on GitHub Pages
        run: tools/publish_pages.sh "Test build ${GITHUB_REF_NAME} $(git rev-parse --short=7 HEAD)"
