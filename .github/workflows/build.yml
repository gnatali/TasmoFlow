name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: node --check app/app.js

      - name: Berry syntax
        run: |
          sudo apt-get install -y --no-install-recommends libreadline-dev
          git clone --depth 1 https://github.com/berry-lang/berry.git "$RUNNER_TEMP/berry"
          make -C "$RUNNER_TEMP/berry" -j"$(nproc)"
          "$RUNNER_TEMP/berry/berry" tools/check_syntax.be extension/*.be

      - name: Build the .tapp and check size budgets
        run: python3 tools/pack_tapp.py

      - name: End-to-end tests (Chromium, simulated gateway)
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
          node tests/e2e.js

      - uses: actions/upload-artifact@v4
        with:
          name: tasmoflow
          path: dist/
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tasmoflow
          path: dist/

      - name: Tag matches the VERSION file
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - name: GitHub release with TasmoFlow.tapp
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/TasmoFlow.tapp --title "TasmoFlow $GITHUB_REF_NAME" --generate-notes

      # Cumulative gh-pages branch: every version stays published under /vX.Y.Z/,
      # because a gateway not yet updated still loads its own version.
      - name: Publish the interface on GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then
            git worktree add "$RUNNER_TEMP/pages" FETCH_HEAD
            git -C "$RUNNER_TEMP/pages" checkout -B gh-pages
          else
            git worktree add --orphan -b gh-pages "$RUNNER_TEMP/pages"
          fi
          cp -r dist/pages/. "$RUNNER_TEMP/pages/"
          touch "$RUNNER_TEMP/pages/.nojekyll"
          git -C "$RUNNER_TEMP/pages" add -A
          git -C "$RUNNER_TEMP/pages" commit -m "Interface $GITHUB_REF_NAME"
          git -C "$RUNNER_TEMP/pages" push origin gh-pages
